<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D · Graphics play</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/three-d.css">
</head>
<body>

<div class="page-wrap">
  <nav class="navbar navbar-default navbar-fixed-top">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".first-navbar-collapse">
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a href="index.html" class="navbar-brand"><svg id="logo" width="100" height="50"></svg></a>
      </div>
      <div class="navbar-collapse navbar-right first-navbar-collapse collapse">
        <ul class="nav navbar-nav">
          <li><a href="animations.html">Animations</a></li>
          <li class="active"><a href="three-d.html">3D</a></li>
          <li><a href="physics.html">Physics</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section>
    <div class="container">
      <h2>Continuous rotation</h2>
      <div class="row">
        <div class="col-md-6 col-md-offset-3">
          <div class="cube-wrap">
            <div class="cube rotate rotate-y">
              <div class="front">front</div>
              <div class="back">back</div>
              <div class="top">top</div>
              <div class="bottom">bottom</div>
              <div class="left">left</div>
              <div class="right">right</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section>
    <div class="container">
      <h2>Sphere</h2>
      <p>Drag to rotate, or use the arrow keys. Esc resets.</p>
      <div id="sphere" class="normal">
        <div class="sphere-rotator">
          <div class="sphere-container"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<section class="footer">
  <div class="container">
